# Конфигурация cargo для этого репозитория. Cargo читает `.cargo/config.toml`
# из текущего каталога и выше, а команды проекта запускаются из корня.
#[build]

# Сколько задач cargo выполняет параллельно (включая линковку).
# По умолчанию cargo берёт число CPU: на 12-ядерной машине `cargo test`
# одновременно линкует все тестовые бинарники, каждый `link.exe` держит
# в памяти debug-инфо — 16 ГБ RAM заканчиваются.
# Ограничение действует, пока строка не закомментирована; разово его
# перебивает переменная окружения: $env:CARGO_BUILD_JOBS = "8".
#jobs = 4
